name: 스트리머 트래킹

on:
  schedule:
    # 등록 채널이 20개 이상으로 늘어나면 매 사이클 요청 수도 그만큼 늘어납니다.
    # 유튜브에 과한 요청으로 보이지 않게 10분 간격으로 잡았습니다.
    # (GitHub Actions 스케줄은 정확히 그 분에 실행되지 않고 몇 분 밀릴 수 있습니다.)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: track-streamers
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 이슈 이벤트를 놓쳤거나 라벨이 없어도 등록/삭제 요청이 반드시 처리되도록
      # 매 사이클 열린 [등록]/[삭제] 이슈를 훑어서 먼저 반영합니다.
      - name: 등록/삭제 요청 처리
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/process_requests.py

      - name: 트래킹 스크립트 실행
        run: python scripts/track.py

      - name: 변경사항 커밋
        run: |
          git config user.name "streamer-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json docs/history.json data/state.json data/channels.json data/history.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 트래킹 결과 업데이트 [skip ci]"
            # 확인하는 사이에 다른 커밋(요청 처리 등)이 올라와 있으면 push가 거부되므로
            # 먼저 원격 변경을 받아 합친 뒤 밀어넣는다. 그래도 실패하면 한 번 더 시도.
            git pull --rebase --autostash || true
            git push || (sleep 5 && git pull --rebase --autostash && git push)
          fi
