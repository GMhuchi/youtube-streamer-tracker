name: 스트리머 트래킹

on:
  schedule:
    # GitHub Actions 스케줄은 최소 단위가 정확히 지켜지지 않고 몇 분 밀릴 수 있습니다.
    # 필요하면 아래 cron 값을 */10 등으로 바꾸세요.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: track-streamers
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 트래킹 스크립트 실행
        run: python scripts/track.py

      - name: 변경사항 커밋
        run: |
          git config user.name "streamer-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/status.json data/state.json data/channels.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 트래킹 결과 업데이트 [skip ci]"
            git push
          fi
