name: 채널 등록/삭제 요청 즉시 처리

# 이슈가 열리면 바로 처리합니다(라벨에 의존하지 않고 제목 접두사로 판단).
# 혹시 이 이벤트를 놓쳐도 "스트리머 트래킹" 워크플로가 매 사이클 열린 요청을
# 다시 훑어서 처리하므로, 요청이 영구히 방치되지는 않습니다.
on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: "특정 이슈 번호만 처리 (비우면 열린 요청 전부)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: channel-requests
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 요청 처리
        id: process
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            python scripts/process_requests.py --issue "$ISSUE_NUMBER"
          else
            python scripts/process_requests.py
          fi

      - name: 변경사항 커밋
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "streamer-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/channels.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 채널 목록 업데이트 (요청 처리) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
