name: 채널 등록 요청 처리

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  add-channel:
    if: contains(github.event.issue.labels.*.name, 'add-channel')
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 이슈 본문 저장
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt

      - name: 채널 정보 확인 및 등록
        id: resolve
        run: |
          python scripts/resolve_channel.py \
            --issue-body-file /tmp/issue_body.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: 변경사항 커밋
        if: steps.resolve.outputs.success == 'true'
        run: |
          git config user.name "streamer-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/channels.json
          git commit -m "chore: 채널 등록 - ${{ steps.resolve.outputs.channel_name }} [skip ci]"
          git push

      - name: 등록 완료 코멘트 및 이슈 닫기
        if: steps.resolve.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ ${{ steps.resolve.outputs.message }}

          다음 트래킹 사이클(최대 5~10분 이내)부터 페이지에 나타납니다."
          gh issue close "${{ github.event.issue.number }}"

      - name: 실패 안내 코멘트
        if: steps.resolve.outputs.success != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "⚠️ ${{ steps.resolve.outputs.message }}

          채널 URL/핸들을 다시 확인해서 이 이슈 내용을 수정해주세요. 수정 후 다시 실행하려면 이슈를 닫았다가 다시 열어주세요."
