name: 요청 전체 다시 훑기 (수동)

# 이 워크플로는 "수동 실행 전용" 백필 도구입니다.
# 등록/삭제 요청의 실제 처리는
#   - .github/workflows/add-channel.yml  (이슈가 열리면 즉시)
#   - .github/workflows/track.yml        (매 확인 주기에 스윕)
# 두 곳에서 하고, 이 파일은 "지금 당장 밀린 요청을 전부 처리해줘"가 필요할 때
# Actions 탭에서 버튼으로 한 번 돌리는 용도입니다.
# (이슈 이벤트로는 절대 실행되지 않으므로 중복 처리 걱정이 없습니다.)
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: channel-requests
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 열린 요청 전부 처리
        id: process
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/process_requests.py

      - name: 변경사항 커밋
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "streamer-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/channels.json
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 채널 목록 업데이트 (백필) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
