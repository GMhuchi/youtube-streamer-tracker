name: "🗑️ 채널 삭제 요청"
description: 트래킹 중인 유튜브 채널을 목록에서 제거해주세요.
title: "[삭제] "
labels: ["remove-channel"]
body:
  - type: markdown
    attributes:
      value: |
        삭제하면 몇 분 안에 자동으로 처리되어 이슈가 닫히고,
        다음 확인 주기부터 목록에서 사라집니다.
        가장 확실한 방법은 사이트에 표시된 채널 이름을 그대로 복사해서 붙여넣는 것입니다.
  - type: input
    id: target
    attributes:
      label: "삭제할 채널 (표시 이름 또는 URL/핸들/채널ID)"
      description: "예: 사이트에 표시된 채널 이름 그대로, 또는 https://www.youtube.com/@핸들, 또는 UC로 시작하는 채널ID"
      placeholder: "예: 홍길동"
    validations:
      required: true
