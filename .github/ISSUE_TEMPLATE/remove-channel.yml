name: "🗑️ 채널 삭제 요청"
description: 트래킹 중인 유튜브 채널을 목록에서 제거해주세요.
title: "[삭제] "
labels: ["remove-channel"]
body:
  - type: markdown
    attributes:
      value: |
        사이트의 "－ 채널 삭제" 버튼에서 들어오셨다면 아래 칸이 **이미 채워져 있습니다.**
        그대로 제출하시면 몇 분 안에 자동으로 처리되어 이슈가 닫힙니다.
        직접 입력하는 경우에는 사이트에 표시된 채널 이름을 그대로 붙여넣으세요.
  - type: input
    id: target
    attributes:
      label: "삭제할 채널 (표시 이름 또는 URL/핸들/채널ID)"
      description: "보통 사이트에서 자동으로 채널ID가 채워집니다. 직접 넣을 때는 표시 이름 그대로 넣어도 됩니다."
      placeholder: "예: 홍길동"
    validations:
      required: true
