name: "📺 채널 등록 요청"
description: 트래킹할 유튜브 채널을 추가해주세요.
title: "[등록] "
labels: ["add-channel"]
body:
  - type: markdown
    attributes:
      value: |
        등록하면 몇 분 안에 자동으로 처리되어 이슈가 닫히고,
        다음 확인 주기부터 트래킹 목록에 나타납니다.
  - type: input
    id: channel_url
    attributes:
      label: 채널 URL 또는 핸들
      description: "예: https://www.youtube.com/@핸들 또는 @핸들 또는 채널 URL 전체"
      placeholder: "https://www.youtube.com/@example"
    validations:
      required: true
  - type: input
    id: display_name
    attributes:
      label: "표시 이름 (선택)"
      description: 비워두면 유튜브 채널명을 그대로 사용합니다.
      placeholder: "홍길동"
    validations:
      required: false
