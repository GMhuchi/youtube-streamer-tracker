<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스트리머 라이브 트래커</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='38' fill='%23ff3b30'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#eef0f3;
    --border:#dde1e6;
    --border-strong:#c7cdd5;
    --text:#14171b;
    --text-dim:#5b6470;
    --live:#d6291f;
    --live-soft:#fbe4e2;
    --accent:#0f8f79;
    --accent-soft:#e1f5f0;
    --warn:#9a5b00;
    --warn-soft:#fdf0dc;
    --shadow:0 1px 2px rgba(20,23,27,0.06), 0 10px 26px -18px rgba(20,23,27,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d10;
      --surface:#14171b;
      --surface-2:#1b1f25;
      --border:#262b32;
      --border-strong:#343b44;
      --text:#e8ecf1;
      --text-dim:#8b95a1;
      --live:#ff453a;
      --live-soft:#3a1416;
      --accent:#34d5b7;
      --accent-soft:#12302b;
      --warn:#f5b342;
      --warn-soft:#3a2c10;
      --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px -18px rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d10;
    --surface:#14171b;
    --surface-2:#1b1f25;
    --border:#262b32;
    --border-strong:#343b44;
    --text:#e8ecf1;
    --text-dim:#8b95a1;
    --live:#ff453a;
    --live-soft:#3a1416;
    --accent:#34d5b7;
    --accent-soft:#12302b;
    --warn:#f5b342;
    --warn-soft:#3a2c10;
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px -18px rgba(0,0,0,0.7);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans KR', 'Archivo', system-ui, sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Archivo','Noto Sans KR',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
    padding:1rem 1.4rem; border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(10px);
  }
  header h1{ font-size:1.15rem; font-weight:800; margin:0; letter-spacing:-.01em; }
  header .dot{
    width:.55rem; height:.55rem; border-radius:50%; background:var(--live);
    box-shadow:0 0 0 0 rgba(214,41,31,.6); animation:pulse 2s infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(214,41,31,.5); }
    70%{ box-shadow:0 0 0 8px rgba(214,41,31,0); }
    100%{ box-shadow:0 0 0 0 rgba(214,41,31,0); }
  }
  header .spacer{ flex:1; }
  header .meta{ font-size:.78rem; color:var(--text-dim); }
  .btn{
    display:inline-flex; align-items:center; gap:.4em;
    border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text); padding:.5em .9em; border-radius:8px;
    font-weight:700; font-size:.82rem; text-decoration:none;
    transition:border-color .15s, transform .1s;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:active{ transform:scale(.98); }

  main{ max-width:980px; margin:0 auto; padding:1.6rem 1.4rem 5rem; }

  .banner{
    display:flex; gap:.6rem; align-items:flex-start;
    background:var(--warn-soft); border:1px solid var(--warn);
    color:var(--warn); border-radius:10px; padding:.8rem 1rem;
    font-size:.85rem; margin-bottom:1.4rem;
  }

  section{ margin-top:2.2rem; }
  section:first-of-type{ margin-top:0; }
  .section-head{
    display:flex; align-items:baseline; gap:.6rem; margin-bottom:.9rem;
  }
  .section-head h2{ font-size:1.05rem; font-weight:800; margin:0; }
  .section-head .count{
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--text-dim);
    background:var(--surface-2); border:1px solid var(--border); padding:.15em .55em; border-radius:999px;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:.9rem;
  }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;
    text-decoration:none; color:inherit; transition:border-color .15s, transform .12s;
  }
  .card:hover{ border-color:var(--border-strong); transform:translateY(-2px); }
  .thumb{
    position:relative; aspect-ratio:16/9; background:var(--surface-2);
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .noimg{ 
    display:flex; align-items:center; justify-content:center; height:100%;
    color:var(--text-dim); font-size:.78rem;
  }
  .live-badge{
    position:absolute; top:.5rem; left:.5rem; display:inline-flex; align-items:center; gap:.35em;
    background:var(--live); color:#fff; font-weight:800; font-size:.68rem; letter-spacing:.04em;
    padding:.22em .5em; border-radius:4px;
  }
  .live-badge .b-dot{ width:.4rem; height:.4rem; border-radius:50%; background:#fff; }
  .viewers-badge{
    position:absolute; bottom:.5rem; right:.5rem;
    background:rgba(0,0,0,.72); color:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:.72rem; padding:.2em .5em; border-radius:4px;
  }
  .card .body{ padding:.75rem .85rem .9rem; display:flex; flex-direction:column; gap:.3rem; flex:1; }
  .card .title{ font-size:.88rem; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .channel{ font-size:.8rem; color:var(--text-dim); font-weight:600; }
  .card .tag-chip{
    align-self:flex-start; margin-top:.15rem; font-family:'IBM Plex Mono',monospace;
    font-size:.66rem; color:var(--accent); background:var(--accent-soft);
    padding:.15em .5em; border-radius:4px;
  }

  .offline-list{ display:flex; flex-direction:column; gap:.4rem; }
  .offline-row{
    display:flex; align-items:center; gap:.7rem; padding:.6rem .8rem;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    font-size:.85rem;
  }
  .offline-row .name{ font-weight:700; flex-shrink:0; }
  .offline-row .sub{ color:var(--text-dim); font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .offline-row .off-dot{ width:.5rem; height:.5rem; border-radius:50%; background:var(--border-strong); flex-shrink:0; }

  .empty{
    color:var(--text-dim); font-size:.88rem; padding:1.4rem; text-align:center;
    border:1px dashed var(--border-strong); border-radius:10px;
  }

  details{ border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  details summary{
    cursor:pointer; padding:.7rem .9rem; font-weight:700; font-size:.88rem;
    background:var(--surface-2); list-style:none; display:flex; align-items:center; gap:.5rem;
  }
  details summary::-webkit-details-marker{ display:none; }
  details summary .chev{ transition:transform .15s; margin-left:auto; color:var(--text-dim); }
  details[open] summary .chev{ transform:rotate(180deg); }
  details .offline-list{ padding:.7rem; }

  footer{
    margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--border);
    color:var(--text-dim); font-size:.78rem; display:flex; justify-content:space-between; flex-wrap:wrap; gap:.6rem;
  }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header>
  <span class="dot" aria-hidden="true"></span>
  <h1 class="display">스트리머 라이브 트래커</h1>
  <span class="spacer"></span>
  <span class="meta mono" id="updatedAt">뎸��,오슔 중…</span>
  <a class="btn" id="registerBtn" href="#" target="_blank" rel="noopener">＋ 채널 등록</a>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <section>
    <div class="section-head">
      <h2 class="display">🔴 지금 방송 중</h2>
      <span class="count mono" id="liveCount">0</span>
    </div>
    <div class="grid" id="liveGrid"></div>
    <div class="empty" id="liveEmpty" hidden>지금 방송 중인 등록 채널이 없습니다.</div>
  </section>

  <section>
    <details id="offlineDetails">
      <summary><span class="display">등록 채널 중 오프라인</span> <span class="count mono" id="offlineCount">0</span><span class="chev">▾</span></summary>
      <div class="offline-list" id="offlineList"></div>
    </details>
  </section>

  <section>
    <div class="section-head">
      <h2 class="display">🔍 태그로 새로 발견</h2>
      <span class="count mono" id="discoveryCount">0</span>
    </div>
    <div class="grid" id="discoveryGrid"></div>
    <div class="empty" id="discoveryEmpty" hidden>발견된 항목이 없습니다.</div>
  </section>

  <footer>
    <span id="discoveryMeta"></span>
    <span>60초마다 자동 새로고침 · 데이터는 GitHub Actions가 5~10분마다 갱신합니다</span>
  </footer>
</main>

<script>
(function(){
  // GitHub Pages URL(https://<owner>.github.io/<repo>/)에서 owner/repo를 자동 추정합니다.
  // 다르게 호스팄한뻤면 아래 REPO_OVERRIDE 에 "owner/repo" 형샜로 직접 직정하세요.
  var REPO_OVERRIDE = "";
  function guessRepo(){
    if (REPO_OVERRIDE) return REPO_OVERRIDE;
    var owner = location.hostname.split('.')[0];
    var parts = location.pathname.split('/').filter(Boolean);
    var repo = parts[0] || (owner + '.github.io');
    if (!owner) return null;
    return owner + '/' + repo;
  }
  var repoSlug = guessRepo();
  var registerBtn = document.getElementById('registerBtn');
  if (repoSlug) {
    registerBtn.href = 'https://github.com/' + repoSlug + '/issues/new?template=add-channel.yml';
  } else {
    registerBtn.href = '#';
    registerBtn.title = '선장소를 자동으로 확인하지 못했습니다. index.html의 REPO_OVERRIDG를 설정하세요.';
  }

  function fmtRelative(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var diffSec = Math.max(0, Math.round((Date.now() - d.getTime())/1000));
    if (diffSec <= 2) return '방금 전';
    if (diffSec < 60) return diffSec + '초 전';
    var diffMin = Math.round(diffSec/60);
    if (diffMin < 60) return diffMin + '분 전';
    var diffH = Math.round(diffMin/60);
    return diffH + '시간 전';
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtViewers(n){
    if (n == null) return null;
    return new Intl.NumberFormat('ko-KR').format(n) + '명 시청 중';
  }

  function liveCard(c){
    var img = c.thumbnail
      ? '<img src="'+esc(c.thumbnail)+'" alt="" loading="lazy">'
      : '<div class="noimg">썸네일 없�</div>';
    var viewers = fmtViewers(c.viewers);
    return (
      '<a class="card" href="'+esc(c.videoUrl || c.channelUrl)+'" target="_blank" rel="noopener">' +
        '<div class="thumb">' + img +
          '<span class="live-badge"><span class="b-dot"></span>LIVE</span>' +
          (viewers ? '<span class="viewers-badge mono">'+esc(viewers)+'</span>' : '') +
        '</div>' +
        '<div class="body">' +
          '<div class="title">'+esc(c.title || c.name)+'</div>' +
          '<div class="channel">'+esc(c.name)+'</div>' +
        '</div>' +
      '</a>'
    );
  }

  function offlineRow(c){
    var sub = c.latestVideoTitle ? ('최근 영상: ' + c.latestVideoTitle) : (c.error || '최근 방송 정보 없음');
    return (
      '<a class="offline-row" href="'+esc(c.channelUrl)+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;">' +
        '<span class="off-dot"></span>' +
        '<span class="name">'+esc(c.name)+'</span>' +
        '<span class="sub">'+esc(sub)+'</span>' +
      '</a>'
    );
  }

  function discoveryCard(item){
    var img = item.thumbnail
      ? '<img src="'+esc(item.thumbnail)+'" alt="" loading="lazy">'
      : '<div class="noimg">썸네일 없�</div>';
    return (
      '<a class="card" href="'+esc(item.videoUrl)+'" target="_blank" rel="noopener">' +
        '<div class="thumb">' + img +
          '<span class="live-badge"><span class="b-dot"></span>LIVE</span>' +
          (item.viewCountText ? '<span class="viewers-badge mono">'+esc(item.viewCountText)+'</span>' : '') +
        '</div>' +
        '<div class="body">' +
          '<div class="title">'+esc(item.title)+'</div>' +
          '<div class="channel">'+esc(item.channelTitle)+'</div>' +
          '<span class="tag-chip">'+esc(item.matchedQuery)+(item.alreadyRegistered ? ' · 등록됨' : '')+'</span>' +
        '</div>' +
      '</a>'
    );
  }

  function render(status){
    document.getElementById('updatedAt').textContent = '갱신: ' + fmtRelative(status.updatedAt);

    var banner = document.getElementById('banner');
    if (status.warning) {
      banner.hidden = false;
      banner.textContent = '⚠ ' + status.warning;
    } else {
      banner.hidden = true;
    }

    var channels = status.channels || [];
    var live = channels.filter(function(c){ return c.isLive; });
    var offline = channels.filter(function(c){ return !c.isLive; });

    document.getElementById('liveCount').textContent = live.length;
    document.getElementById('liveGrid').innerHTML = live.map(liveCard).join('');
    document.getElementById('liveEmpty').hidden = live.length > 0;

    document.getElementById('offlineCount').textContent = offline.length;
    document.getElementById('offlineList').innerHTML = offline.map(offlineRow).join('');

    var disc = status.discovery || {};
    var items = disc.items || [];
    document.getElementById('discoveryCount').textContent = items.length;
    document.getElementById('discoveryGrid').innerHTML = items.map(discoveryCard).join('');
    document.getElementById('discoveryEmpty').hidden = items.length > 0;
    document.getElementById('discoveryMeta').textContent = disc.updatedAt
      ? ('검색어: ' + (disc.queries||[]).join(', ') + ' · 검색 겱신: ' + fmtRelative(disc.updatedAt))
      : '';
  }

  function load(){
    fetch('status.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(render)
      .catch(function(err){
        document.getElementById('updatedAt').textContent = '불러오꬀ 실패';
        var banner = document.getElementById('banner');
        banner.hidden = false;
        banner.textContent = '⚠ status.json을 불러오지 못했습니다 (' + err.message + '). GitHub Actions가 아직 한 번도 실행되지 않았을 수 있습니다.';
      });
  }

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
