<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방송 이력 · 스트리머 트래커</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='38' fill='%230f8f79'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f3;
    --border:#dde1e6; --border-strong:#c7cdd5;
    --text:#14171b; --text-dim:#5b6470;
    --live:#d6291f; --accent:#0f8f79; --accent-soft:#e1f5f0;
    --warn:#9a5b00; --warn-soft:#fdf0dc;
    --shadow:0 1px 2px rgba(20,23,27,0.06), 0 10px 26px -18px rgba(20,23,27,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d10; --surface:#14171b; --surface-2:#1b1f25;
      --border:#262b32; --border-strong:#343b44;
      --text:#e8ecf1; --text-dim:#8b95a1;
      --live:#ff453a; --accent:#34d5b7; --accent-soft:#12302b;
      --warn:#f5b342; --warn-soft:#3a2c10;
      --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px -18px rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d10; --surface:#14171b; --surface-2:#1b1f25;
    --border:#262b32; --border-strong:#343b44;
    --text:#e8ecf1; --text-dim:#8b95a1;
    --live:#ff453a; --accent:#34d5b7; --accent-soft:#12302b;
    --warn:#f5b342; --warn-soft:#3a2c10;
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px -18px rgba(0,0,0,0.7);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans KR','Archivo',system-ui,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Archivo','Noto Sans KR',system-ui,sans-serif; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }

  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
    padding:1rem 1.4rem; border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(10px);
  }
  header h1{ font-size:1.15rem; font-weight:800; margin:0; letter-spacing:-.01em; }
  header .spacer{ flex:1; }
  header .meta{ font-size:.78rem; color:var(--text-dim); }
  .btn{
    display:inline-flex; align-items:center; gap:.4em;
    border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text); padding:.5em .9em; border-radius:8px;
    font-weight:700; font-size:.82rem; text-decoration:none; cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:active{ transform:scale(.98); }
  .btn.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

  main{ max-width:1080px; margin:0 auto; padding:1.6rem 1.4rem 5rem; }

  .banner{
    display:flex; gap:.6rem; align-items:flex-start;
    background:var(--warn-soft); border:1px solid var(--warn);
    color:var(--warn); border-radius:10px; padding:.8rem 1rem;
    font-size:.85rem; margin-bottom:1.4rem;
  }

  .totals{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:.9rem; margin-bottom:1.6rem;
  }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:1rem 1.1rem; box-shadow:var(--shadow);
  }
  .stat .label{ font-size:.78rem; color:var(--text-dim); font-weight:700; }
  .stat .value{
    font-family:'IBM Plex Mono',monospace; font-size:1.7rem; font-weight:600;
    line-height:1.2; margin-top:.25rem;
  }
  .stat .value .unit{ font-size:.9rem; color:var(--text-dim); margin-left:.15em; }
  .stat .sub{ font-size:.75rem; color:var(--text-dim); margin-top:.2rem; }

  section{ margin-top:2.2rem; }
  .section-head{ display:flex; align-items:baseline; gap:.6rem; margin-bottom:.9rem; flex-wrap:wrap; }
  .section-head h2{ font-size:1.05rem; font-weight:800; margin:0; }
  .section-head .count{
    font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--text-dim);
    background:var(--surface-2); border:1px solid var(--border); padding:.15em .55em; border-radius:999px;
  }
  .section-head .note{ font-size:.75rem; color:var(--text-dim); margin-left:auto; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  table{ width:100%; border-collapse:collapse; font-size:.86rem; min-width:640px; }
  th,td{ padding:.6rem .8rem; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{
    font-size:.75rem; color:var(--text-dim); font-weight:700; background:var(--surface-2);
    position:sticky; top:0;
  }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  td.name{ white-space:normal; min-width:150px; font-weight:600; }
  td.name a{ color:inherit; text-decoration:none; }
  td.name a:hover{ text-decoration:underline; }
  .live-dot{
    display:inline-block; width:.5rem; height:.5rem; border-radius:50%;
    background:var(--live); margin-right:.4em; vertical-align:middle;
  }
  .off-dot{
    display:inline-block; width:.5rem; height:.5rem; border-radius:50%;
    background:var(--border-strong); margin-right:.4em; vertical-align:middle;
  }
  .zero{ color:var(--text-dim); }
  .tag{
    font-family:'IBM Plex Mono',monospace; font-size:.68rem;
    color:var(--accent); background:var(--accent-soft); padding:.1em .45em; border-radius:4px;
  }
  .tag.gray{ color:var(--text-dim); background:var(--surface-2); }

  .sessions{ display:flex; flex-direction:column; gap:.4rem; }
  .srow{
    display:flex; align-items:center; gap:.7rem; padding:.6rem .8rem; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; font-size:.84rem;
  }
  .srow .who{ font-weight:700; min-width:9rem; }
  .srow .when{ font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--text-dim); }
  .srow .dur{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .srow .what{ color:var(--text-dim); flex:1; min-width:12rem; overflow:hidden; text-overflow:ellipsis; }
  .srow a{ color:inherit; text-decoration:none; }
  .srow a:hover{ text-decoration:underline; }

  .empty{
    color:var(--text-dim); font-size:.88rem; padding:1.4rem; text-align:center;
    border:1px dashed var(--border-strong); border-radius:10px;
  }

  /* --- 채널 상세 --- */
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--surface-2); }
  tbody tr.sel{ background:var(--accent-soft); }
  tbody tr.sel td{ border-bottom-color:var(--accent); }
  td .chev-cell{ color:var(--text-dim); font-size:.7rem; }

  .detail{
    margin-top:1rem; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .detail-head{
    display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
    padding:.9rem 1.1rem; border-bottom:1px solid var(--border); background:var(--surface-2);
  }
  .detail-head h3{ margin:0; font-size:1rem; font-weight:800; }
  .detail-head a{ color:inherit; text-decoration:none; }
  .detail-head a:hover{ text-decoration:underline; }
  .detail-head .close{
    margin-left:auto; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--text-dim); border-radius:6px; padding:.2em .55em; cursor:pointer; font-size:.78rem;
  }
  .detail-body{ padding:1rem 1.1rem 1.2rem; }

  .mini-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.6rem; margin-bottom:1.1rem; }
  .mini{
    border:1px solid var(--border); border-radius:10px; padding:.6rem .75rem; background:var(--bg);
  }
  .mini .l{ font-size:.72rem; color:var(--text-dim); font-weight:700; }
  .mini .v{ font-family:'IBM Plex Mono',monospace; font-size:1.15rem; font-weight:600; line-height:1.3; }
  .mini .s{ font-size:.7rem; color:var(--text-dim); }

  .chart-wrap{ position:relative; margin:.2rem 0 1rem; }
  .chart-title{ font-size:.82rem; font-weight:700; margin-bottom:.1rem; }
  .chart-sub{ font-size:.72rem; color:var(--text-dim); margin-bottom:.5rem; }
  .chart-wrap svg{ display:block; width:100%; height:auto; overflow:visible; touch-action:none; }
  .chart-wrap .axis{ stroke:var(--border); stroke-width:1; }
  .chart-wrap .grid{ stroke:var(--border); stroke-width:1; opacity:.55; }
  .chart-wrap .tick{ fill:var(--text-dim); font-size:10px; font-family:'IBM Plex Mono',monospace; }
  .chart-wrap .series{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .chart-wrap .area{ fill:var(--accent); opacity:.10; }
  .chart-wrap .avgline{ stroke:var(--text-dim); stroke-width:1; stroke-dasharray:4 3; opacity:.8; }
  .chart-wrap .cross{ stroke:var(--text-dim); stroke-width:1; opacity:.7; }
  .chart-wrap .dot{ fill:var(--accent); stroke:var(--surface); stroke-width:2; }
  .tip{
    position:absolute; pointer-events:none; z-index:5; transform:translate(-50%, -115%);
    background:var(--surface); border:1px solid var(--border-strong); border-radius:7px;
    padding:.35rem .55rem; font-size:.75rem; white-space:nowrap; box-shadow:var(--shadow);
  }
  .tip .t{ color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:.7rem; }
  .tip .v{ font-weight:700; font-family:'IBM Plex Mono',monospace; }

  .sess-list{ display:flex; flex-direction:column; gap:.35rem; }
  .sess{
    display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; text-align:left; width:100%;
    padding:.5rem .7rem; border:1px solid var(--border); border-radius:8px;
    background:var(--bg); color:inherit; font:inherit; font-size:.82rem; cursor:pointer;
  }
  .sess:hover{ border-color:var(--border-strong); }
  .sess.on{ border-color:var(--accent); background:var(--accent-soft); }
  .sess .when{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--text-dim); }
  .sess .dur{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .sess .vw{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; }
  .sess .ttl{ flex:1; min-width:9rem; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nodata{ font-size:.8rem; color:var(--text-dim); padding:.8rem 0; }
  footer{
    margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--border);
    color:var(--text-dim); font-size:.78rem;
  }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<header>
  <h1 class="display">📊 방송 이력</h1>
  <span class="spacer"></span>
  <span class="meta mono" id="updatedAt">불러오는 중…</span>
  <button class="btn on" id="scopeBtn" type="button">이터널리턴만</button>
  <a class="btn" href="./">← 라이브 현황</a>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <div class="totals" id="totals"></div>

  <section>
    <div class="section-head">
      <h2 class="display">최근 방송 기록</h2>
      <span class="count mono" id="sessionCount">0</span>
      <span class="note">방송 시작~종료 시각 (유튜브가 알려주는 실제 시각 기준)</span>
    </div>
    <div class="sessions" id="sessionList"></div>
    <div class="empty" id="sessionEmpty" hidden>
      아직 기록된 방송이 없습니다. 등록 채널이 방송을 시작하면 이때부터 자동으로 쌓입니다.
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2 class="display">채널별 방송 시간</h2>
      <span class="count mono" id="channelCount">0</span>
      <span class="note">채널을 누르면 방송 이력과 시청자수 추이를 볼 수 있습니다 · 한국 시간(KST) 기준</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>채널</th>
            <th class="num">오늘</th>
            <th class="num">이번 주</th>
            <th class="num">이번 달</th>
            <th class="num">평균 시청자</th>
            <th class="num">최고</th>
            <th>최근 방송</th>
          </tr>
        </thead>
        <tbody id="channelRows"></tbody>
      </table>
    </div>
    <div class="empty" id="channelEmpty" hidden>등록된 채널이 없습니다.</div>
    <div id="detail"></div>
  </section>

  <footer>
    <div>10분마다 자동 확인 · 이 페이지는 60초마다 새로고침됩니다.</div>
    <div id="tzNote"></div>
  </footer>
</main>

<script>
(function(){
  var scopeGame = true;   // true = 이터널리턴만, false = 전체 방송
  var data = null;
  var selectedChannel = null;  // 상세를 펼친 채널 ID
  var selectedSession = 0;     // 상세에서 선택한 방송 인덱스

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtHours(minutes){
    var m = Math.round(minutes || 0);
    if (m <= 0) return '0';
    var h = Math.floor(m / 60);
    var rem = m % 60;
    if (h === 0) return rem + '분';
    if (rem === 0) return h + '시간';
    return h + '시간 ' + rem + '분';
  }

  function fmtKst(iso){
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    // KST(UTC+9) 고정 표시
    var k = new Date(d.getTime() + 9*3600*1000);
    var mm = String(k.getUTCMonth()+1).padStart(2,'0');
    var dd = String(k.getUTCDate()).padStart(2,'0');
    var hh = String(k.getUTCHours()).padStart(2,'0');
    var mi = String(k.getUTCMinutes()).padStart(2,'0');
    return mm + '/' + dd + ' ' + hh + ':' + mi;
  }

  function fmtRelative(iso){
    if(!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var diffSec = Math.max(0, Math.round((Date.now() - d.getTime())/1000));
    if (diffSec <= 2) return '방금 전';
    if (diffSec < 60) return diffSec + '초 전';
    var diffMin = Math.round(diffSec/60);
    if (diffMin < 60) return diffMin + '분 전';
    var diffH = Math.round(diffMin/60);
    if (diffH < 24) return diffH + '시간 전';
    return Math.round(diffH/24) + '일 전';
  }

  function pick(bucket){
    if (!bucket) return 0;
    return scopeGame ? bucket.gameMinutes : bucket.totalMinutes;
  }

  function renderTotals(){
    var t = data.totals || {};
    var labels = [
      ['today', '오늘'],
      ['week', '이번 주'],
      ['month', '이번 달']
    ];
    var html = labels.map(function(pair){
      var key = pair[0], label = pair[1];
      var b = t[key] || {};
      var mins = pick(b);
      var sub = scopeGame
        ? ('전체 방송 ' + fmtHours(b.totalMinutes))
        : ('이터널리턴 ' + fmtHours(b.gameMinutes));
      return '<div class="stat">' +
        '<div class="label">' + esc(label) + '</div>' +
        '<div class="value">' + esc(fmtHours(mins)) + '</div>' +
        '<div class="sub">' + esc(sub) + ' · ' + (b.sessions||0) + '회</div>' +
      '</div>';
    }).join('');
    document.getElementById('totals').innerHTML = html;
  }

  function fmtNum(n){
    if (n == null) return '-';
    return new Intl.NumberFormat('ko-KR').format(Math.round(n));
  }

  function renderChannels(){
    var rows = (data.channels || []).map(function(c){
      var b = c.buckets || {};
      function cell(key){
        var mins = pick(b[key]);
        var cls = mins > 0 ? 'num' : 'num zero';
        return '<td class="' + cls + '">' + esc(fmtHours(mins)) + '</td>';
      }
      var status = c.isLive
        ? '<span class="live-dot"></span>'
        : '<span class="off-dot"></span>';
      var badge = c.registered ? '' : ' <span class="tag gray">등록해제</span>';
      var recent = c.isLive
        ? ('방송 중 · ' + esc(fmtKst(c.liveSince)) + ' 시작')
        : (c.lastEnd ? (esc(fmtKst(c.lastEnd)) + ' 종료 (' + esc(fmtRelative(c.lastEnd)) + ')') : '기록 없음');
      // 시청자 수치는 "선택한 기간"이 아니라 이번 달 기준으로 한 번에 보여준다
      var mb = b.month || {};
      var avg = c.isLive && c.liveViewers != null ? c.liveViewers : mb.avgViewers;
      var avgLabel = c.isLive && c.liveViewers != null ? (fmtNum(avg) + '명 (지금)') : (mb.avgViewers != null ? fmtNum(mb.avgViewers) + '명' : '-');
      var peak = mb.peakViewers;
      var selected = selectedChannel === c.channelId ? ' class="sel"' : '';
      return '<tr' + selected + ' data-cid="' + esc(c.channelId) + '">' +
        '<td class="name">' + status +
          esc(c.name) + badge + ' <span class="chev-cell">▾</span>' +
        '</td>' +
        cell('today') + cell('week') + cell('month') +
        '<td class="num' + (avg == null ? ' zero' : '') + '">' + esc(avgLabel) + '</td>' +
        '<td class="num' + (peak == null ? ' zero' : '') + '">' + (peak == null ? '-' : esc(fmtNum(peak)) + '명') + '</td>' +
        '<td>' + recent + '</td>' +
      '</tr>';
    }).join('');
    var tbody = document.getElementById('channelRows');
    tbody.innerHTML = rows;
    document.getElementById('channelCount').textContent = (data.channels || []).length;
    document.getElementById('channelEmpty').hidden = (data.channels || []).length > 0;
    Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
      tr.addEventListener('click', function(e){
        if (e.target.tagName === 'A') return;
        var cid = tr.getAttribute('data-cid');
        selectedChannel = (selectedChannel === cid) ? null : cid;
        selectedSession = 0;
        renderChannels();
        renderDetail();
        if (selectedChannel) {
          var d = document.getElementById('detail');
          if (d) d.scrollIntoView({block:'nearest', behavior:'smooth'});
        }
      });
    });
  }

  // ---- 시청자수 추이 차트 (의존성 없는 인라인 SVG) ----
  // 단일 계열이라 범례 없이 제목이 계열을 설명한다. 선 2px, 눈금/격자는 흐리게,
  // 점은 모든 포인트에 찍지 않고 마우스가 가리키는 지점에만 찍는다.
  function buildChart(container, samples, opts){
    opts = opts || {};
    var pts = (samples || []).map(function(s){
      return { t: new Date(s[0]).getTime(), v: Number(s[1]) };
    }).filter(function(p){ return isFinite(p.t) && isFinite(p.v); })
      .sort(function(a,b){ return a.t - b.t; });

    if (pts.length === 0) {
      container.innerHTML = '<div class="nodata">이 방송은 시청자수 기록이 없습니다. ' +
        '(시청자수는 방송 중 10분마다 기록되며, 이 기능이 켜지기 전 방송은 값이 없습니다.)</div>';
      return;
    }

    var W = 720, H = 210, padL = 46, padR = 12, padT = 12, padB = 26;
    var t0 = pts[0].t, t1 = pts[pts.length-1].t;
    if (t1 === t0) { t1 = t0 + 60000; }
    var vmax = Math.max.apply(null, pts.map(function(p){ return p.v; }));
    var vmin = 0;                       // 시청자수는 0 기준으로 봐야 크기 비교가 정직하다
    var top = vmax <= 0 ? 1 : vmax * 1.15;

    function X(t){ return padL + (t - t0) / (t1 - t0) * (W - padL - padR); }
    function Y(v){ return padT + (1 - (v - vmin) / (top - vmin)) * (H - padT - padB); }

    // y축 눈금 3개
    function niceTicks(maxV){
      var raw = maxV / 3;
      var mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
      var step = Math.ceil(raw / mag) * mag;
      var out = [];
      for (var v = 0; v <= maxV * 1.0001; v += step) out.push(v);
      return out;
    }
    var yticks = niceTicks(top);

    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
    var area = 'M' + X(pts[0].t).toFixed(1) + ' ' + Y(0).toFixed(1) + ' ' +
               pts.map(function(p){ return 'L' + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ') +
               ' L' + X(pts[pts.length-1].t).toFixed(1) + ' ' + Y(0).toFixed(1) + ' Z';

    var svg = [];
    svg.push('<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="시청자수 추이">');
    yticks.forEach(function(v){
      svg.push('<line class="grid" x1="' + padL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W-padR) + '" y2="' + Y(v).toFixed(1) + '"/>');
      svg.push('<text class="tick" x="' + (padL - 6) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end">' + fmtNum(v) + '</text>');
    });
    svg.push('<path class="area" d="' + area + '"/>');
    svg.push('<path class="series" d="' + d + '"/>');
    if (opts.avg != null && isFinite(opts.avg)) {
      svg.push('<line class="avgline" x1="' + padL + '" y1="' + Y(opts.avg).toFixed(1) + '" x2="' + (W-padR) + '" y2="' + Y(opts.avg).toFixed(1) + '"/>');
      svg.push('<text class="tick" x="' + (W-padR) + '" y="' + (Y(opts.avg) - 4).toFixed(1) + '" text-anchor="end">평균 ' + fmtNum(opts.avg) + '</text>');
    }
    svg.push('<line class="axis" x1="' + padL + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W-padR) + '" y2="' + Y(0).toFixed(1) + '"/>');
    svg.push('<text class="tick" x="' + padL + '" y="' + (H - 8) + '">' + esc(fmtKst(new Date(t0).toISOString())) + '</text>');
    svg.push('<text class="tick" x="' + (W-padR) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(fmtKst(new Date(t1).toISOString())) + '</text>');
    svg.push('<line class="cross" x1="0" y1="' + padT + '" x2="0" y2="' + (H-padB) + '" style="display:none"/>');
    svg.push('<circle class="dot" r="4" cx="0" cy="0" style="display:none"/>');
    svg.push('<rect x="' + padL + '" y="' + padT + '" width="' + (W-padL-padR) + '" height="' + (H-padT-padB) + '" fill="transparent"/>');
    svg.push('</svg>');
    container.innerHTML = svg.join('') + '<div class="tip" style="display:none"></div>';

    // 호버: 세로 십자선 + 가까운 표본에 점 + 툴팁
    var svgEl = container.querySelector('svg');
    var cross = container.querySelector('.cross');
    var dot = container.querySelector('.dot');
    var tip = container.querySelector('.tip');

    function onMove(ev){
      var rect = svgEl.getBoundingClientRect();
      var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      var ratio = (cx - rect.left) / rect.width;
      var svgX = ratio * W;
      if (svgX < padL || svgX > W - padR) { onLeave(); return; }
      var t = t0 + (svgX - padL) / (W - padL - padR) * (t1 - t0);
      var best = pts[0], bestD = Infinity;
      pts.forEach(function(p){
        var dd = Math.abs(p.t - t);
        if (dd < bestD) { bestD = dd; best = p; }
      });
      var px = X(best.t), py = Y(best.v);
      cross.setAttribute('x1', px); cross.setAttribute('x2', px);
      cross.style.display = '';
      dot.setAttribute('cx', px); dot.setAttribute('cy', py);
      dot.style.display = '';
      tip.innerHTML = '<div class="t">' + esc(fmtKst(new Date(best.t).toISOString())) + '</div>' +
                      '<div class="v">' + esc(fmtNum(best.v)) + '명 시청 중</div>';
      tip.style.display = '';
      tip.style.left = (px / W * 100) + '%';
      tip.style.top = (py / H * rect.height) + 'px';
    }
    function onLeave(){
      cross.style.display = 'none';
      dot.style.display = 'none';
      tip.style.display = 'none';
    }
    svgEl.addEventListener('mousemove', onMove);
    svgEl.addEventListener('mouseleave', onLeave);
    svgEl.addEventListener('touchmove', onMove, {passive:true});
    svgEl.addEventListener('touchend', onLeave);
  }

  function renderDetail(){
    var host = document.getElementById('detail');
    if (!host) return;
    if (!selectedChannel) { host.innerHTML = ''; return; }
    var c = (data.channels || []).filter(function(x){ return x.channelId === selectedChannel; })[0];
    if (!c) { host.innerHTML = ''; return; }

    var sessions = (c.recentSessions || []).slice();
    // 진행 중인 방송을 목록 맨 앞에 가상 항목으로 얹는다
    var liveItem = null;
    if (c.isLive) {
      liveItem = {
        start: c.liveSince, end: null, minutes: null,
        title: c.liveTitle, videoUrl: c.liveVideoUrl,
        avgViewers: c.liveAvgViewers, peakViewers: c.livePeakViewers,
        samples: c.liveSamples || [], live: true
      };
      sessions.unshift(liveItem);
    }
    if (selectedSession >= sessions.length) selectedSession = 0;

    var mb = (c.buckets || {}).month || {};
    var tb = (c.buckets || {}).today || {};
    var wb = (c.buckets || {}).week || {};

    var head = '<div class="detail-head">' +
      (c.isLive ? '<span class="live-dot"></span>' : '<span class="off-dot"></span>') +
      '<h3><a href="' + esc(c.channelUrl) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a></h3>' +
      (c.isLive ? '<span class="tag">방송 중</span>' : '') +
      '<button class="close" type="button" id="detailClose">닫기 ✕</button>' +
    '</div>';

    function mini(label, value, sub){
      return '<div class="mini"><div class="l">' + esc(label) + '</div>' +
             '<div class="v">' + value + '</div>' +
             '<div class="s">' + esc(sub || '') + '</div></div>';
    }

    var stats = '<div class="mini-stats">' +
      mini('오늘', esc(fmtHours(pick(tb))), tb.sessions ? tb.sessions + '회 방송' : '방송 없음') +
      mini('이번 주', esc(fmtHours(pick(wb))), wb.sessions ? wb.sessions + '회 방송' : '방송 없음') +
      mini('이번 달', esc(fmtHours(pick(mb))), mb.sessions ? mb.sessions + '회 방송' : '방송 없음') +
      mini('평균 시청자', mb.avgViewers != null ? esc(fmtNum(mb.avgViewers)) + '<span style="font-size:.75rem">명</span>' : '-', '이번 달, 방송 길이 가중') +
      mini('최고 시청자', mb.peakViewers != null ? esc(fmtNum(mb.peakViewers)) + '<span style="font-size:.75rem">명</span>' : '-', '이번 달') +
    '</div>';

    var sel = sessions[selectedSession];
    var chartTitle = '', chartSub = '';
    if (sel) {
      chartTitle = (sel.live ? '지금 방송 중' : esc(fmtKst(sel.start)) + ' 방송') + ' — 시청자수 추이';
      chartSub = (sel.title ? esc(String(sel.title)) : '') +
        (sel.avgViewers != null ? ' · 평균 ' + esc(fmtNum(sel.avgViewers)) + '명' : '') +
        (sel.peakViewers != null ? ' · 최고 ' + esc(fmtNum(sel.peakViewers)) + '명' : '');
    }
    var chart = '<div class="chart-title">' + chartTitle + '</div>' +
                '<div class="chart-sub">' + chartSub + '</div>' +
                '<div class="chart-wrap" id="chartHost"></div>';

    var list = sessions.length
      ? '<div class="sess-list">' + sessions.map(function(s, i){
          var when = s.live
            ? (esc(fmtKst(s.start)) + ' ~ 진행 중')
            : (esc(fmtKst(s.start)) + ' → ' + esc(fmtKst(s.end)));
          var dur = s.live ? '진행 중' : fmtHours(s.minutes);
          var vw = (s.avgViewers != null ? '평균 ' + fmtNum(s.avgViewers) : '평균 -') +
                   (s.peakViewers != null ? ' / 최고 ' + fmtNum(s.peakViewers) : '');
          return '<button class="sess' + (i === selectedSession ? ' on' : '') + '" data-idx="' + i + '" type="button">' +
            '<span class="when">' + when + '</span>' +
            '<span class="dur">' + esc(dur) + '</span>' +
            '<span class="vw">' + esc(vw) + '</span>' +
            '<span class="ttl">' + esc(s.title || '') + '</span>' +
          '</button>';
        }).join('') + '</div>'
      : '<div class="nodata">아직 기록된 방송이 없습니다.</div>';

    host.innerHTML = '<div class="detail">' + head +
      '<div class="detail-body">' + stats + chart +
      '<div class="chart-title" style="margin-top:.4rem;">방송 이력</div>' +
      '<div class="chart-sub">방송을 누르면 그 방송의 추이를 볼 수 있습니다.</div>' +
      list + '</div></div>';

    if (sel) buildChart(document.getElementById('chartHost'), sel.samples, {avg: sel.avgViewers});

    document.getElementById('detailClose').addEventListener('click', function(){
      selectedChannel = null;
      renderChannels();
      renderDetail();
    });
    Array.prototype.forEach.call(host.querySelectorAll('.sess'), function(b){
      b.addEventListener('click', function(){
        selectedSession = parseInt(b.getAttribute('data-idx'), 10) || 0;
        renderDetail();
      });
    });
  }

  function renderSessions(){
    var list = (data.recentSessions || []).filter(function(s){
      return scopeGame ? s.isTargetGame : true;
    });
    var html = list.map(function(s){
      var link = s.videoUrl
        ? '<a href="' + esc(s.videoUrl) + '" target="_blank" rel="noopener">' + esc(s.title || '(제목 없음)') + '</a>'
        : esc(s.title || '(제목 없음)');
      var tag = s.isTargetGame ? '<span class="tag">이터널리턴</span>' : '<span class="tag gray">' + esc(s.game || '기타') + '</span>';
      var vw = s.avgViewers != null
        ? ('평균 ' + fmtNum(s.avgViewers) + (s.peakViewers != null ? ' / 최고 ' + fmtNum(s.peakViewers) : '') + '명')
        : '';
      return '<div class="srow">' +
        '<span class="who">' + esc(s.name) + '</span>' +
        '<span class="when">' + esc(fmtKst(s.start)) + ' → ' + esc(fmtKst(s.end)) + '</span>' +
        '<span class="dur">' + esc(fmtHours(s.minutes)) + '</span>' +
        (vw ? '<span class="when">' + esc(vw) + '</span>' : '') +
        tag +
        '<span class="what">' + link + '</span>' +
      '</div>';
    }).join('');
    document.getElementById('sessionList').innerHTML = html;
    document.getElementById('sessionCount').textContent = list.length;
    document.getElementById('sessionEmpty').hidden = list.length > 0;
  }

  function renderAll(){
    if (!data) return;
    document.getElementById('updatedAt').textContent = '갱신: ' + fmtRelative(data.updatedAt);
    document.getElementById('tzNote').textContent =
      '집계 기준: ' + (data.timezone || 'Asia/Seoul') + ' · 오늘=00:00부터, 이번 주=월요일부터, 이번 달=1일부터';
    renderTotals();
    renderChannels();
    renderDetail();
    renderSessions();
  }

  document.getElementById('scopeBtn').addEventListener('click', function(){
    scopeGame = !scopeGame;
    this.textContent = scopeGame ? '이터널리턴만' : '전체 방송';
    this.classList.toggle('on', scopeGame);
    renderAll();
  });

  function load(){
    fetch('history.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){ data = j; document.getElementById('banner').hidden = true; renderAll(); })
      .catch(function(err){
        document.getElementById('updatedAt').textContent = '불러오기 실패';
        var banner = document.getElementById('banner');
        banner.hidden = false;
        banner.textContent = '⚠ history.json을 불러오지 못했습니다 (' + err.message +
          '). 트래킹 워크플로가 아직 한 번도 실행되지 않았을 수 있습니다.';
      });
  }

  load();
  setInterval(load, 60000);
})();
</script>
